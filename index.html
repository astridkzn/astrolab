<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#080808">
  <title>ASTROLAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ─── LOGIN ─────────────────────────────────────────────────────────── -->
  <div id="screen-login" class="screen">
    <div class="login-bg"></div>
    <div class="login-wrap">
      <div class="login-logo">
        <div class="logo-astro">ASTROLAB</div>
        <div class="logo-year">2026</div>
      </div>
      <form id="login-form">
        <div class="input-wrap">
          <input type="password" id="login-input" placeholder="mot de passe" autocomplete="off">
        </div>
        <button type="submit" class="btn-enter">ENTRER</button>
        <p id="login-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <!-- ─── APP ───────────────────────────────────────────────────────────── -->
  <div id="screen-app" class="screen hidden">

    <header id="app-header">
      <span id="header-title">Accueil</span>
    </header>

    <main id="app-main"></main>

    <button id="fab-down" class="scroll-fab hidden" aria-label="Défiler vers le bas">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,9 12,15 18,9"/></svg>
    </button>
    <button id="fab-up" class="scroll-fab hidden" aria-label="Retour en haut">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,15 12,9 18,15"/></svg>
    </button>

    <nav id="bottom-nav">
      <button class="nav-btn active" data-view="home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
        <span>Accueil</span>
      </button>
      <button class="nav-btn" data-view="programme">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <span>Prog</span>
      </button>
      <button class="nav-btn" data-view="catering">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2"/>
          <line x1="7" y1="2" x2="7" y2="22"/>
          <path d="M21 15V2a5 5 0 00-5 5v6c0 1.1.9 2 2 2h3"/>
          <line x1="21" y1="15" x2="21" y2="22"/>
        </svg>
        <span>Catering</span>
      </button>
      <button class="nav-btn" data-view="logistique">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span>Trajet</span>
      </button>
      <button class="nav-btn" data-view="dodo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
        <span>Dodo</span>
      </button>
    </nav>

  </div>

  <!-- ─── DJ MODAL ─────────────────────────────────────────────────────── -->
  <div id="dj-modal" class="modal hidden">
    <div class="modal-bg" id="modal-bg"></div>
    <div class="modal-sheet">
      <button class="modal-close" id="modal-close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
